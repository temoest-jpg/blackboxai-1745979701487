<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Inventory - Car Resale Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.tailwindcss.com" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <header class="mb-6">
    <h1 class="text-3xl font-bold text-center text-gray-800">Car Inventory</h1>
    <nav class="mt-4 flex justify-center space-x-4">
      <a href="index.html" class="text-blue-600 hover:underline">Inventory</a>
      <a href="add-car.html" class="text-blue-600 hover:underline">Add Car</a>
      <a href="sales.html" class="text-blue-600 hover:underline">Sales</a>
    </nav>
  </header>

  <main>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white rounded shadow">
        <thead>
          <tr>
            <th class="py-2 px-4 border-b border-gray-200 text-left">Make</th>
            <th class="py-2 px-4 border-b border-gray-200 text-left">Model</th>
            <th class="py-2 px-4 border-b border-gray-200 text-left">Year</th>
            <th class="py-2 px-4 border-b border-gray-200 text-left">Price</th>
            <th class="py-2 px-4 border-b border-gray-200 text-left">Status</th>
            <th class="py-2 px-4 border-b border-gray-200 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="car-list">
          <!-- Car rows will be inserted here -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function fetchCars() {
      const response = await fetch('/api/cars');
      const cars = await response.json();
      const tbody = document.getElementById('car-list');
      tbody.innerHTML = '';
      cars.forEach(car => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50';
        tr.innerHTML = `
          <td class="py-2 px-4 border-b border-gray-200">${car.make}</td>
          <td class="py-2 px-4 border-b border-gray-200">${car.model}</td>
          <td class="py-2 px-4 border-b border-gray-200">${car.year}</td>
          <td class="py-2 px-4 border-b border-gray-200">$${car.price.toFixed(2)}</td>
          <td class="py-2 px-4 border-b border-gray-200">${car.status}</td>
          <td class="py-2 px-4 border-b border-gray-200 text-center space-x-2">
            <a href="edit-car.html?id=${car.id}" class="text-blue-600 hover:underline">Edit</a>
            <button onclick="deleteCar(${car.id})" class="text-red-600 hover:underline">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteCar(id) {
      if (confirm('Are you sure you want to delete this car?')) {
        const response = await fetch(`/api/cars/${id}`, { method: 'DELETE' });
        if (response.ok) {
          fetchCars();
        } else {
          alert('Failed to delete car.');
        }
      }
    }

    fetchCars();
  </script>
</body>
</html>
